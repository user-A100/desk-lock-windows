<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Desk Lock · 专注锁定</title>
    <link rel="stylesheet" href="lock.css" />
  </head>
  <body>
    <main class="lock-shell">
      <header class="lock-header">
        <div class="lock-brand"><span class="lock-fruit"></span><span>Desk Lock</span></div>
        <span class="mode-badge" id="mode-badge">学霸模式</span>
      </header>

      <section class="lock-content">
        <div class="lock-copy">
          <p class="lock-kicker">正在保护这段时间</p>
          <h1 id="lock-title">专注时间</h1>
          <p class="blocked-message" id="blocked-message">其他应用暂时放在门外。</p>
        </div>

        <div class="timer-column">
          <div class="clock-stage">
            <div class="timer-ring" id="timer-ring" style="--progress: 1">
              <div class="timer-inner">
                <strong id="lock-timer">25:00</strong>
              </div>
            </div>
            <div class="flip-clock" id="flip-clock" role="timer" aria-label="25 分 00 秒"></div>
          </div>
          <div class="exact-time" aria-live="off">
            <span>当前时间</span>
            <strong id="current-time">20:18:36</strong>
            <small id="end-time">预计 20:43 结束</small>
          </div>
          <div class="lock-actions">
            <button id="show-dashboard" class="lock-btn lock-btn-secondary">打开专注面板</button>
            <button id="stop-focus" class="lock-btn lock-btn-quiet">结束本次专注</button>
          </div>
        </div>

        <div class="allowed-section">
          <h2>本次可用</h2>
          <div id="allowed-apps" class="allowed-apps"></div>
        </div>
      </section>

      <footer class="lock-footer">
        <span>按计划结束后会自动恢复桌面</span>
        <span class="footer-tools"><button id="clock-style-toggle" class="clock-style-toggle" title="切换计时器样式">显示 · 翻页</button><span id="lock-date"></span></span>
      </footer>
    </main>

    <dialog id="emergency-dialog" aria-labelledby="emergency-title">
      <form method="dialog" id="emergency-form">
        <p class="dialog-note">严格模式应急恢复</p>
        <h2 id="emergency-title">先等一分钟，再决定。</h2>
        <p id="cooldown-copy">冷静期可以避免下意识退出。真正需要恢复时，你始终可以回来。</p>
        <label><span>冷静期结束后输入“结束本次专注”</span><input id="emergency-phrase" autocomplete="off" disabled /></label>
        <p class="dialog-error" id="dialog-error" role="status"></p>
        <div class="dialog-actions">
          <button type="button" class="lock-btn lock-btn-secondary" id="cancel-emergency">继续专注</button>
          <button type="submit" class="lock-btn lock-btn-danger" id="confirm-emergency" disabled>等待 60 秒</button>
        </div>
      </form>
    </dialog>

    <script src="core.js"></script>
    <script src="lock.js"></script>
  </body>
</html>
